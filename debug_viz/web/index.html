<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>debug_viz</title>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<header>
  <button id="gallery_toggle" class="icon-btn" title="Toggle gallery (g)">≡</button>
  <h1>debug_viz</h1>
  <div id="status" class="status disconnected">offline</div>
  <div id="count" class="count">0 frames</div>
  <div id="font_scale" class="seg seg-sm" title="UI font size">
    <button data-fs="s">S</button>
    <button data-fs="m" class="on">M</button>
    <button data-fs="l">L</button>
    <button data-fs="xl">XL</button>
  </div>
</header>

<div id="split">
  <aside id="pane_gallery" class="pane pane-gallery">
    <div id="gallery"></div>
  </aside>
  <section id="pane_viewer" class="pane pane-viewer">
    <div id="viewer_empty" class="viewer-empty">
      <div>
        <p>No frame selected.</p>
        <p class="hint">Click a thumbnail to inspect.</p>
      </div>
    </div>
    <div id="viewer_root" class="viewer-root hidden">
      <div class="viewer-header">
        <h2 id="v_title" class="v-title" contenteditable="true" spellcheck="false"></h2>
        <span id="v_kind" class="kind-badge"></span>
        <div class="spacer"></div>
        <button id="v_delete" class="danger ghost" title="Delete frame">Delete</button>
      </div>
      <div id="v_canvas_row" class="canvas-row"></div>
      <div id="v_controls" class="controls"></div>
      <div id="v_meta" class="v-meta"></div>
    </div>
  </section>
</div>

<template id="tile_tmpl">
  <article class="tile">
    <button class="del" title="Delete">×</button>
    <span class="kind-badge tile-kind"></span>
    <div class="thumb-wrap"></div>
    <div class="meta">
      <div class="label" contenteditable="true" spellcheck="false"></div>
      <div class="stats"></div>
    </div>
  </article>
</template>

<template id="panel_tmpl">
  <div class="vp">
    <div class="vp-header">
      <input class="vp-title" type="text" spellcheck="false" />
      <span class="vp-shape"></span>
    </div>
    <div class="vp-osd"></div>
    <div class="vp-stats"></div>
  </div>
</template>

<script src="/static/openseadragon.min.js"></script>
<script src="/static/split.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
